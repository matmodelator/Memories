    text: `
Покрыто будущее мраком,
И что-то в темечке брюзжит.
Я заливаю боль араком,
А время яростно бежит.

Обуреваемый смятеньем
Погряз в неведомой глуши,
В чужих горах ища спасенья
Бессмертной якобы души.

Проходят дни как в сериале,
Снята комфортная тюрьма.
В моём очередном серале
Царит всё та же кутерьма.

Тут по углам всё те же тени,
Всё ту же пыль ногой клублю.
Я не могу расстаться с теми,
Которых всё ещё люблю.

Бурлит во мне и оживает
Всё то, что помню испокон.
А сердце новый страх сжимает,
И годы падают с погон.

Рисуют карты вертопрахи,
Трещит и ломится редут.
Десятки тыщ, чтоб лечь во прахе,
Рядами стройными бредут,

И захламляют лесопо́лки,
И в норах медленно гниют.
Меж ними кабаны да волки
Тенями адскими снуют.

Кошмарно, но уже нормально…
Мир близок, но недостижим.
А где-то там - сестра и мама,
И дом, в котором я не жил.

Пора в кровать, да вот не спится, 
И пляшет чёртик молодой.
Мне до сих пор ночами снится
Твоя улыбка и ладонь.

Так я лежу один в потёмках,
На потолке считая швы.
И тонет ночь в кровоподтёках
Ещё не проклятой души. 


Далия, 26.07.26

Аннотация от ИИ

Начало стихотворения сразу задаёт необычный тон. Вместо привычного описания тревоги появляется почти физиологическое ощущение:

И что-то в темечке брюзжит.

В чужих горах ища спасенья

Снята комфортная тюрьма.

Я не могу расстаться с теми,
Которых всё ещё люблю.

И годы падают с погон.

Предпоследняя строфа теперь приобрела дополнительную глубину.

Пора в кровать, да мне б не спиться...

После арака из первой строфы эта строка замыкает композицию. Алкоголь появляется сначала как средство заглушить боль, а затем — как угроза окончательно проиграть самому себе. Это одна из лучших композиционных перекличек в стихотворении.

Финал построен очень точно.

Так я лежу один в потёмках,
На потолке считая швы.

Максимально бытовая деталь неожиданно приводит к строке:

И тонет ночь в кровоподтёках
Ещё не проклятой души.

      if (files[index + 1]) {

      panel.classList.toggle("is-fullscreen");

    } else {

      // иначе просто возвращаем текст стиха без переключения режима
      poemEl.innerHTML = originalText;

    }

  });
}
});
</script>

<!-- FULL Screen mode -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  // Находим область чтения
  const panel = document.querySelector(".reading-panel");
  if (!panel) return;

  // Обработчик клика по reading-panel
  panel.addEventListener("click", function (e) {

    // Страховка: если клик не внутри reading-panel — ничего не делаем
    // (обычно не требуется, но безопасно оставить)
    if (!panel.contains(e.target)) return;

    // ВАЖНО:
    // Если клик был по панели кнопок (.poem-buttons),
    // то fullscreen НЕ переключаем.
    // Это блокирует реакции на:
    // ◀️ ⬆️ ⬇️ ℹ️ 🔢 🔤 🚻 🔄 💟
    if (e.target.closest(".poem-buttons")) return;

    // Если клик был по самому полю чтения (тексту или фону),
    // переключаем режим full screen
    panel.classList.toggle("is-fullscreen");

  });

});
</script>
