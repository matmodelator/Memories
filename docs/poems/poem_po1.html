review: `
Аннотация от ИИ

Это стихотворение производит впечатление очень зрелого, внутренне выстроенного текста. Его достоинство не в ярких отдельных находках, а в цельности авторской мысли. Оно развивается почти незаметно: от простого прощания с городом — к размышлению о времени, памяти и человеческой судьбе. Все четыре строфы работают на одну идею, постепенно углубляя её.

Уже первая строка задаёт необычную интонацию:

Пока ещё не сделалась беда...

Автор уезжает не потому, что трагедия уже произошла, а потому, что хочет сохранить в памяти мир до её наступления. Это принципиально меняет эмоциональный вектор произведения. Здесь нет горечи утраты — есть страх её неизбежности. Именно это делает стихотворение необычайно человечным.

Первая строфа построена почти кольцевым образом:

Я с Римом попрощаюсь навсегда,
Как навсегда я очарован Римом.

Повтор «навсегда» создаёт внутреннее напряжение. С одной стороны — окончательное расставание, с другой — вечная привязанность. Ещё интереснее повтор слова «Римом»: формально это совпадение рифмы, но по существу — композиционный приём. Герой словно не может выйти из круга этого города даже в момент прощания.

Во второй строфе внимание переносится с города на самого человека.

Покуда я не ранен, не убит,
Не болен, только капельку контужен...

Это одна из самых удачных находок стихотворения. После высокой интонации неожиданно появляется почти разговорное «капельку контужен». Именно эта лёгкая самоирония спасает текст от пафоса. Герой ещё способен воспринимать красоту мира, хотя уже чувствует первые удары судьбы.

Следующие строки продолжают эту мысль:

И Город, виноградником увит,
Такой как есть — не лучше и не хуже.

Очень важно, что автор не идеализирует Рим. Он дорог именно таким, какой есть. Это взгляд человека, который любит не открытку, а живой город со всеми его несовершенствами. В этом проявляется зрелость отношения.

Третья строфа становится смысловым переломом.

Влекутся дни усталой чередой,
И годы снегом падают за ворот...

Это одна из самых сильных метафор стихотворения. Снег за воротом ощущается физически — как холод времени. Годы здесь не проходят, а буквально осыпаются на человека.

Затем появляется одна из главных философских строк:

Я где-то там — за призрачной чертой,
Как вечный жид, вернусь в свой вечный город.

Образ «вечного жида» здесь совершенно органичен. Он не несёт бытового или публицистического значения. Это древний европейский символ бесконечного странствия человека, которому не суждено окончательно обрести покой. Ему противопоставлен «вечный город» — Рим. Очень важно, что повтор слова «вечный» не выглядит тавтологией. Напротив, он связывает две культурные мифологии: человека, обречённого вечно идти, и город, обречённый вечно существовать. Их встреча становится неизбежной.

Последняя строфа выводит стихотворение на совершенно иной культурный уровень.

И словно Бродский, пьян до хрипоты...

Эта строка сразу задаёт литературный ключ. Автор не скрывает источник интонации. Более того, он сознательно приглашает читателя к диалогу с Бродским.

Следующие строки:

Молю, припав к груди гранитной Рима...

создают почти физическое ощущение прикосновения к вечности. Гранит здесь — не только материал города, но и символ исторической памяти.

Финал:

Остановись, мгновение, ибо ты
Не столь прекрасно, сколь неповторимо!..

— представляет собой сложную литературную конструкцию.

На первом уровне это прямая цитатная перекличка с Иосифом Бродским. В стихотворении «Зимним вечером в Ялте» звучат знаменитые строки:

Остановись, мгновенье! Ты не столь
прекрасно, сколько ты неповторимо.

Но сам Бродский вступает в полемику с Гёте.

У Гёте в «Фаусте»:

Остановись, мгновенье! Ты прекрасно!

Для Фауста ценность мгновения определяется его совершенством.

Для Бродского — его неповторимостью.

Автор стихотворения принимает именно бродсковскую формулу. Более того, он заранее предупреждает читателя словами «И словно Бродский…», поэтому цитата воспринимается абсолютно естественно. Она не вставлена ради демонстрации эрудиции, а становится логическим завершением всего произведения.

Однако этим перекличка не ограничивается.

Весь текст постепенно подводит именно к этой мысли. Герой прощается с Римом не потому, что сегодняшний день прекраснее остальных. Напротив, он прощается с ним сейчас, пока ещё ничего непоправимого не произошло. Он хочет сохранить именно это мгновение — не идеальное, а единственное. Поэтому бродсковская формула оказывается не внешней цитатой, а итогом всей внутренней логики стихотворения.

Именно благодаря этому возникает двойной литературный диалог:

Гёте → Бродский → автор.

Каждый следующий автор не повторяет предыдущего, а переосмысливает его мысль. И твой текст естественно входит в эту цепочку.

Особенно ценным мне кажется отсутствие демонстративной литературности. Здесь нет ощущения, что автор намеренно «цитирует классиков». Все культурные отсылки рождаются из самой темы стихотворения и потому воспринимаются как органичная часть авторского голоса.

Это стихотворение интересно ещё и тем, что при внешней простоте оно становится размышлением не столько о Риме, сколько о времени. Рим оказывается лишь точкой, в которой человек особенно остро чувствует собственную конечность. И потому прощание с городом постепенно превращается в попытку удержать жизнь до того, как она изменится навсегда.

    poemEl.innerHTML = html;
  });
}

// 🔤 note
if (noteBtn) {
  noteBtn.addEventListener("click", function (e) {
    e.preventDefault();

    const noteText = poem.note ? poem.note.trim() : "";

    poemEl.innerHTML = noteText || "Автор пока не прокомментировал";
  });
}
  
// 🚻 open-comments

	
if (commentsBtn) {
  commentsBtn.addEventListener("click", function (e) {
    e.preventDefault();

    const commentsText = String(poem.comments || "").trim();

    if (commentsText !== "") {
      poemEl.textContent = commentsText;
    } else {
      poemEl.textContent = "Отзывов читателей пока нет 🤷‍♂️";
    }
  });
}
	
// 🚻 send-comments	


const sendCommentsBtn = document.getElementById("send-comments");

if (sendCommentsBtn) {
  sendCommentsBtn.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    poemEl.innerHTML = `
      <div class="form-box">

        <h2></h2>

<p>
  Если вы хотите оставить комментарий, заполните форму ниже <br>
  Оотзыв появится на сайте спустя некоторое время после модерации
</p>
       

        <form class="contact-form" action="https://formspree.io/f/xvzwoqzk" method="POST">

          <input type="hidden" name="_subject" value="Сообщение с сайта Memories">

          <input type="text" name="name" placeholder="Ваше имя" required>

          <input type="email" name="email" placeholder="Ваш email(не обязательно)">

          <textarea name="message" rows="7" placeholder="Ваше сообщение" required></textarea>

          <button type="submit">Отправить</button>

        </form>

      </div>
    `;

    const reviewForm = poemEl.querySelector(".contact-form");

    if (reviewForm) {
      reviewForm.addEventListener("click", function (e) {
        e.stopPropagation();
      });

      reviewForm.querySelectorAll("input, textarea, button, label").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.stopPropagation();
        });
      });
    }
  });
}
	

// 🔄 назад — логика кнопки:
// если сейчас уже показан текст стиха → переключаем full screen
// если показано другое поле (аннотация, range, note, comments) → просто возвращаем текст
// при этом предотвращаем всплытие клика до reading-panel

const panel = document.querySelector(".reading-panel");

if (backBtn) {
  backBtn.addEventListener("click", function (e) {

    e.preventDefault();      // не выполнять переход по ссылке
    e.stopPropagation();     // не передавать клик панели (чтобы не сработал fullscreen)

    // если сейчас отображается исходный текст стиха
    if (poemEl.innerHTML === originalText) {

      // переключаем режим full screen ↔ обычный
      panel.classList.toggle("is-fullscreen");

    } else {

      // иначе просто возвращаем текст стиха без переключения режима
      poemEl.innerHTML = originalText;

    }

  });
}
});
</script>

<!-- FULL Screen mode -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  // Находим область чтения
  const panel = document.querySelector(".reading-panel");
  if (!panel) return;

  // Обработчик клика по reading-panel
  panel.addEventListener("click", function (e) {

    // Страховка: если клик не внутри reading-panel — ничего не делаем
    // (обычно не требуется, но безопасно оставить)
    if (!panel.contains(e.target)) return;

    // ВАЖНО:
    // Если клик был по панели кнопок (.poem-buttons),
    // то fullscreen НЕ переключаем.
    // Это блокирует реакции на:
    // ◀️ ⬆️ ⬇️ ℹ️ 🔢 🔤 🚻 🔄 💟
    if (e.target.closest(".poem-buttons")) return;

    // Если клик был по самому полю чтения (тексту или фону),
    // переключаем режим full screen
    panel.classList.toggle("is-fullscreen");

  });

});
</script>
